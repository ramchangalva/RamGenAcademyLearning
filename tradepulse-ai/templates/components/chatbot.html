{% if chatbot_providers %}
<!-- AI Chatbot -->
<div class="card mb-4" id="chatbot">
    <div class="card-header" style="background: linear-gradient(135deg, #6D5BFF, #C05CFF, #FF5C93); color: white; border: none;">
        <h4 style="margin: 0; font-weight: 700;"><i class="fas fa-robot"></i> AI Trading Assistant</h4>
    </div>
    <div class="card-body">
        <!-- API Key Configuration Section -->
        <div class="mb-4" style="background: var(--bg-secondary); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 style="margin: 0; color: var(--text-primary); font-weight: 600;">
                    <i class="fas fa-key"></i> API Key Configuration
                </h5>
                <button class="btn btn-sm btn-outline-primary" onclick="toggleApiKeySection()">
                    <i class="fas fa-chevron-down" id="api-key-toggle-icon"></i> <span id="api-key-toggle-text">Show</span>
                </button>
            </div>
            <div id="api-key-section" style="display: none;">
                <div class="row g-3">
                    {% for provider in chatbot_providers %}
                    <div class="col-md-6">
                        <label for="api-key-{{ provider.name }}" class="form-label">
                            <strong>{{ provider.display_name }} API Key</strong>
                            {% if provider.configured %}
                            <span class="badge bg-success ms-2">Configured</span>
                            {% else %}
                            <span class="badge bg-warning ms-2">Not Configured</span>
                            {% endif %}
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="api-key-{{ provider.name }}" 
                                   placeholder="Enter {{ provider.display_name }} API key"
                                   data-provider="{{ provider.name }}">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('api-key-{{ provider.name }}')">
                                <i class="fas fa-eye" id="eye-icon-{{ provider.name }}"></i>
                            </button>
                            <button class="btn btn-primary" type="button" onclick="saveApiKey('{{ provider.name }}')">
                                <i class="fas fa-save"></i> Save
                            </button>
                        </div>
                        {% if provider.name == 'openai' %}
                        <div class="mt-2">
                            <label for="base-url-openai" class="form-label small">Base URL (Optional)</label>
                            <input type="text" class="form-control form-control-sm" id="base-url-openai" 
                                   placeholder="https://api.openai.com/v1">
                        </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                <div class="mt-3">
                    <button class="btn btn-sm btn-danger" onclick="clearAllApiKeys()">
                        <i class="fas fa-trash"></i> Clear All API Keys
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="chatbot-provider" class="form-label">AI Provider</label>
                <select class="form-select" id="chatbot-provider">
                    {% for provider in chatbot_providers %}
                    <option value="{{ provider.name }}" {% if provider.configured %}selected{% endif %}>
                        {{ provider.display_name }} {% if not provider.configured %}(Enter API Key Above){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="chatbot-model" class="form-label">Model</label>
                <select class="form-select" id="chatbot-model">
                    <option value="">Select a provider first</option>
                </select>
            </div>
        </div>

        <div id="chat-messages" style="height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem; background: var(--bg-secondary);">
            <div class="alert alert-info mb-2">
                <i class="fas fa-info-circle"></i> Welcome! Ask me anything about stocks, trading, or analysis.
            </div>
        </div>

        <div class="input-group">
            <input type="text" class="form-control" id="chat-input" 
                   placeholder="Ask a question about stocks, trading, or analysis..." 
                   onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button class="btn btn-primary" type="button" onclick="sendChatMessage()">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>
    </div>
</div>

<script>
    let chatHistory = [];
    
    document.addEventListener('DOMContentLoaded', function() {
        const providerSelect = document.getElementById('chatbot-provider');
        const modelSelect = document.getElementById('chatbot-model');
        
        if (providerSelect && modelSelect) {
            loadProviderModels();
            providerSelect.addEventListener('change', loadProviderModels);
        }
        
        loadApiKeys();
    });
    
    function toggleApiKeySection() {
        const section = document.getElementById('api-key-section');
        const icon = document.getElementById('api-key-toggle-icon');
        const text = document.getElementById('api-key-toggle-text');
        
        if (section.style.display === 'none') {
            section.style.display = 'block';
            icon.className = 'fas fa-chevron-up';
            text.textContent = 'Hide';
        } else {
            section.style.display = 'none';
            icon.className = 'fas fa-chevron-down';
            text.textContent = 'Show';
        }
    }
    
    function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById('eye-icon-' + inputId.replace('api-key-', ''));
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }
    
    async function saveApiKey(provider) {
        const input = document.getElementById('api-key-' + provider);
        const apiKey = input.value.trim();
        
        if (!apiKey) {
            alert('Please enter an API key');
            return;
        }
        
        try {
            const payload = {
                provider: provider,
                api_key: apiKey
            };
            
            if (provider === 'openai') {
                const baseUrlInput = document.getElementById('base-url-openai');
                if (baseUrlInput && baseUrlInput.value.trim()) {
                    payload.base_url = baseUrlInput.value.trim();
                }
            }
            
            const response = await fetch('/api/chatbot/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert('API key saved successfully!');
                input.value = '';
                location.reload();
            } else {
                alert('Error saving API key: ' + (data.error || 'Unknown error'));
            }
        } catch (error) {
            alert('Error saving API key: ' + error.message);
        }
    }
    
    async function loadApiKeys() {
        try {
            const response = await fetch('/api/chatbot/keys');
            const data = await response.json();
            
            if (data.keys) {
                for (const [provider, keyData] of Object.entries(data.keys)) {
                    const input = document.getElementById('api-key-' + provider);
                    if (input && keyData.has_key) {
                        input.placeholder = 'API key saved (' + keyData.api_key + ')';
                    }
                }
            }
        } catch (error) {
            // Silent fail
        }
    }
    
    async function clearAllApiKeys() {
        if (!confirm('Are you sure you want to clear all API keys? This cannot be undone.')) {
            return;
        }
        
        try {
            const providers = ['openai', 'anthropic', 'google', 'cohere', 'huggingface'];
            for (const provider of providers) {
                await fetch(`/api/chatbot/keys/${provider}`, {
                    method: 'DELETE'
                });
            }
            alert('All API keys cleared. Please refresh the page.');
            location.reload();
        } catch (error) {
            alert('Error clearing API keys: ' + error.message);
        }
    }
    
    async function loadProviderModels() {
        const providerSelect = document.getElementById('chatbot-provider');
        const modelSelect = document.getElementById('chatbot-model');
        
        if (!providerSelect || !modelSelect) return;
        
        const provider = providerSelect.value;
        
        try {
            const response = await fetch(`/api/chatbot/models/${provider}`);
            const data = await response.json();
            
            modelSelect.innerHTML = '';
            if (data.models && data.models.length > 0) {
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    modelSelect.appendChild(option);
                });
            } else {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No models available';
                modelSelect.appendChild(option);
            }
        } catch (error) {
            // Silent fail
        }
    }
    
    async function sendChatMessage() {
        const input = document.getElementById('chat-input');
        if (!input) return;
        
        const message = input.value.trim();
        if (!message) return;
        
        const providerSelect = document.getElementById('chatbot-provider');
        const modelSelect = document.getElementById('chatbot-model');
        
        if (!providerSelect || !modelSelect) {
            alert('Chatbot not available');
            return;
        }
        
        const provider = providerSelect.value;
        const model = modelSelect.value;
        
        if (!model) {
            alert('Please select a model');
            return;
        }
        
        addChatMessage('user', message);
        input.value = '';
        
        const loadingId = addChatMessage('assistant', 'Thinking...', true);
        chatHistory.push({ role: 'user', content: message });
        
        try {
            const response = await fetch('/api/chatbot/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    provider: provider,
                    model: model,
                    messages: chatHistory,
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });
            
            const data = await response.json();
            removeChatMessage(loadingId);
            
            if (data.success) {
                addChatMessage('assistant', data.content);
                chatHistory.push({ role: 'assistant', content: data.content });
            } else {
                addChatMessage('assistant', `Error: ${data.error}`, false, true);
            }
        } catch (error) {
            removeChatMessage(loadingId);
            addChatMessage('assistant', `Error: ${error.message}`, false, true);
        }
    }
    
    function addChatMessage(role, content, isLoading = false, isError = false) {
        const messagesDiv = document.getElementById('chat-messages');
        if (!messagesDiv) return null;
        
        const messageId = 'msg-' + Date.now();
        const messageDiv = document.createElement('div');
        messageDiv.id = messageId;
        messageDiv.className = `mb-3 ${isError ? 'alert alert-danger' : ''}`;
        
        const roleClass = role === 'user' ? 'text-end' : 'text-start';
        const roleIcon = role === 'user' ? 'fa-user' : 'fa-robot';
        const roleColor = role === 'user' ? 'primary' : 'success';
        
        messageDiv.innerHTML = `
            <div class="${roleClass}">
                <span class="badge bg-${roleColor} mb-2">
                    <i class="fas ${roleIcon}"></i> ${role === 'user' ? 'You' : 'AI'}
                </span>
                <div style="background: ${role === 'user' ? 'var(--primary)' : 'var(--bg-card)'}; color: ${role === 'user' ? 'white' : 'var(--text-primary)'}; padding: 0.75rem; border-radius: var(--radius-md); display: inline-block; max-width: 80%;">
                    ${isLoading ? '<i class="fas fa-spinner fa-spin"></i> ' : ''}${content}
                </div>
            </div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        return messageId;
    }
    
    function removeChatMessage(messageId) {
        const messageDiv = document.getElementById(messageId);
        if (messageDiv) {
            messageDiv.remove();
        }
    }
</script>
{% endif %}
