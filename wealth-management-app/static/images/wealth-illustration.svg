<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="300" cy="300" r="280" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Chart/Graph Illustration -->
  <g transform="translate(150, 200)">
    <!-- Chart Bars -->
    <rect x="0" y="120" width="40" height="80" fill="url(#gradient1)" rx="4"/>
    <rect x="60" y="80" width="40" height="120" fill="url(#gradient1)" rx="4"/>
    <rect x="120" y="60" width="40" height="140" fill="url(#gradient1)" rx="4"/>
    <rect x="180" y="40" width="40" height="160" fill="url(#gradient1)" rx="4"/>
    <rect x="240" y="20" width="40" height="180" fill="url(#gradient1)" rx="4"/>
    
    <!-- Trend Line -->
    <path d="M 20 200 L 80 160 L 140 140 L 200 120 L 260 100" stroke="url(#gradient2)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="200" r="6" fill="url(#gradient2)"/>
    <circle cx="80" cy="160" r="6" fill="url(#gradient2)"/>
    <circle cx="140" cy="140" r="6" fill="url(#gradient2)"/>
    <circle cx="200" cy="120" r="6" fill="url(#gradient2)"/>
    <circle cx="260" cy="100" r="6" fill="url(#gradient2)"/>
  </g>
  
  <!-- Money/Coin Icons -->
  <g transform="translate(100, 400)">
    <circle cx="0" cy="0" r="30" fill="url(#gradient1)" opacity="0.8"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="24" font-weight="bold">$</text>
  </g>
  
  <g transform="translate(500, 400)">
    <circle cx="0" cy="0" r="30" fill="url(#gradient2)" opacity="0.8"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="24" font-weight="bold">₹</text>
  </g>
  
  <!-- Growth Arrow -->
  <g transform="translate(300, 450)">
    <path d="M -50 0 L 0 -30 L 50 0" stroke="url(#gradient1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="url(#gradient1)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Shield/Protection Icon -->
  <g transform="translate(300, 150)">
    <path d="M 0 -40 L 30 0 L 0 40 L -30 0 Z" fill="url(#gradient1)" opacity="0.3"/>
    <path d="M 0 -30 L 20 0 L 0 30 L -20 0 Z" fill="url(#gradient1)" opacity="0.5"/>
  </g>
</svg>
