# PostgreSQL + app. Compose loads `.env` from this directory for ${VAR} substitution.
# Create `.env` with SECRET_KEY=... (32+ chars). Optional: POSTGRES_PASSWORD, WEB_PORT, OPENAI_API_KEY.
#
#   docker compose up -d --build
# App: http://localhost:9000

services:
  web:
    # Local: wealthplanner:latest. For registry push use e.g. DOCKER_IMAGE=myuser/wealthplanner:latest in .env
    image: ${DOCKER_IMAGE:-wealthplanner:latest}
    build: .
    ports:
      - "${WEB_PORT:-9000}:9000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file — see .env.example}
      DATABASE_URL: postgresql+psycopg2://wealthuser:${POSTGRES_PASSWORD:-wealthpass}@db:5432/wealthdb
      ENVIRONMENT: production
      DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      TRADING_SYNC_HMAC_SECRET: ${TRADING_SYNC_HMAC_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wealthuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthpass}
      POSTGRES_DB: wealthdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthuser -d wealthdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
