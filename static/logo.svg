<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Main Chart/Graph Icon -->
  <path d="M 40 140 L 60 120 L 80 100 L 100 80 L 120 70 L 140 60 L 160 50" 
        stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- AI Brain/Neural Network Nodes -->
  <circle cx="100" cy="50" r="12" fill="url(#grad2)"/>
  <circle cx="70" cy="80" r="8" fill="url(#grad1)"/>
  <circle cx="130" cy="80" r="8" fill="url(#grad1)"/>
  <circle cx="85" cy="110" r="8" fill="url(#grad1)"/>
  <circle cx="115" cy="110" r="8" fill="url(#grad1)"/>
  
  <!-- Connection Lines (Neural Network) -->
  <line x1="100" y1="50" x2="70" y2="80" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="50" x2="130" y2="80" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="80" x2="85" y2="110" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="80" x2="115" y2="110" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Pulse/Wave Effect -->
  <circle cx="100" cy="50" r="20" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Trading Arrow -->
  <path d="M 150 130 L 170 130 L 165 120 M 170 130 L 165 140" 
        stroke="url(#grad1)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
